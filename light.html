<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIGHT BULBING</title>
</head>
<body>
<h2> What Can JavaScript Do? </h2>
<p id="demo"> JavaScript can change HTML attribute values.</p>
<p> In this case JavaScript changes the value of the src(source) attribute of an image.</p>
<button type="button" onclick="document.getElementById('myImage').src= 'bulb on.jpg'">Turn on the bulb</button>
<img id ="myImage" src="bulb off.jpg" alt="Bulb" style="width:100px">
<button type="button" onclick="document.getElementById('myImage').src= 'bulb off.jpg'">Turn off the bulb</button>
</body>
</html>
